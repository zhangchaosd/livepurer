name: master builder

on:
  push:
    branches: [ master, main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Golang env
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Test
        run: go test -v ./...
      - name: Build
        run: go build
